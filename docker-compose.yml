services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./backup:/backup

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 1; done;
      mc mb -p local/ict-attachments || true;
      mc anonymous set download local/ict-attachments || true;
      exit 0;
      "

  server:
    build:
      context: ./server
    depends_on:
      - mongo
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      TIME_ZONE: ${TIME_ZONE:-Asia/Yangon}
      UPLOAD_DIR: /uploads
      MONGO_URI: mongodb://mongo:27017/ict_incident_tracker
      JWT_SECRET: replace_me_with_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
      ENABLE_SOCKET: "true"
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ict-attachments}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/ict-attachments}
    volumes:
      - ./upload:/app/uploads
    expose:
      - "5000"

  client:
    build:
      context: ./client
      args:
        VITE_TIME_ZONE: ${TIME_ZONE:-Asia/Yangon}
    depends_on:
      - server
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    depends_on:
      - client
      - server
    ports:
      - "80:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro




volumes:
  mongo_data:
  minio_data:
